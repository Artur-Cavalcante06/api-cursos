services:
  postgres:
    image: postgres:18
    container_name: postgres-cursos
    environment:
      POSTGRES_DB: api_cursos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_cursos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: api-cursos-app
    ports:
      - "8080:8080"
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_cursos
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: